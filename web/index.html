<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube 擷取工具 - 向日葵網頁版 🌻</title>
    <!-- 引入 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sunflower-bg-decorator"></div>
    <div class="app-container">
        <!-- 標題區 -->
        <header class="app-header">
            <!-- 新增：連線狀態指示燈號 -->
            <div class="connection-status">
                <span id="status-lamp" class="lamp offline"></span>
                <span id="status-text" class="status-label">離線 🔴</span>
            </div>
            
            <div class="logo-icon">🌻</div>
            <h1 class="app-title">Youtube 擷取工具</h1>
            <p class="app-subtitle">向日葵特別版 | 前後端分離架構</p>
        </header>

        <!-- 分頁導覽列 -->
        <nav class="tabs-nav">
            <button class="tab-link active" data-tab="download-tab">下載 YouTube</button>
            <button class="tab-link" data-tab="cut-tab">本地剪輯</button>
            <button class="tab-link" data-tab="transcribe-tab">語音辨識</button>
        </nav>

        <!-- 主操作卡片 -->
        <main class="main-card">
            
            <!-- 分頁 1：下載 YouTube -->
            <div id="download-tab" class="tab-content active">
                <div class="input-group">
                    <label for="youtube-url" class="field-label">請輸入 YouTube 影片網址</label>
                    <input type="text" id="youtube-url" class="url-input" placeholder="https://www.youtube.com/watch?v=...">
                </div>

                <div class="mode-section">
                    <span class="field-label">請選擇下載模式</span>
                    <div class="mode-cards">
                        <label class="mode-card">
                            <input type="radio" name="download-mode" value="1" class="hidden-radio">
                            <div class="card-content">
                                <span class="card-icon">🎬</span>
                                <span class="card-title">僅影像</span>
                                <span class="card-desc">無聲音 (bestvideo)</span>
                            </div>
                        </label>
                        <label class="mode-card">
                            <input type="radio" name="download-mode" value="2" class="hidden-radio">
                            <div class="card-content">
                                <span class="card-icon">🎵</span>
                                <span class="card-title">僅聲音</span>
                                <span class="card-desc">轉 MP3 音訊 (192k)</span>
                            </div>
                        </label>
                        <label class="mode-card">
                            <input type="radio" name="download-mode" value="3" checked class="hidden-radio">
                            <div class="card-content">
                                <span class="card-icon">🌟</span>
                                <span class="card-title">影音合併</span>
                                <span class="card-desc">高清合併 (推薦)</span>
                            </div>
                        </label>
                    </div>
                </div>

                <button id="download-btn" class="action-btn">
                    <span class="btn-text">開始下載</span>
                    <span class="btn-loader hidden"></span>
                </button>
            </div>

            <!-- 分頁 2：本地剪輯 -->
            <div id="cut-tab" class="tab-content">
                <div class="file-select-section">
                    <button id="cut-file-btn" class="file-btn">📂 選擇影片/音檔...</button>
                    <span id="cut-filename" class="filename-display">尚未選擇檔案</span>
                </div>

                <button id="cut-preview-btn" class="secondary-btn" disabled>▶ 系統預覽 (查看時間)</button>

                <!-- 時間輸入區 -->
                <div class="time-setting-section">
                    <div class="time-block">
                        <span class="field-label">開始時間</span>
                        <div class="time-inputs">
                            <input type="text" id="start-h" class="time-input" value="00" maxlength="2"> :
                            <input type="text" id="start-m" class="time-input" value="00" maxlength="2"> :
                            <input type="text" id="start-s" class="time-input" value="00" maxlength="2">
                        </div>
                    </div>
                    <div class="time-block">
                        <span class="field-label">結束時間</span>
                        <div class="time-inputs">
                            <input type="text" id="end-h" class="time-input" value="00" maxlength="2"> :
                            <input type="text" id="end-m" class="time-input" value="00" maxlength="2"> :
                            <input type="text" id="end-s" class="time-input" value="00" maxlength="2">
                        </div>
                    </div>
                </div>

                <button id="cut-execute-btn" class="action-btn" disabled>✂️ 執行剪輯</button>

                <!-- 剪輯成果按鈕區 -->
                <div class="result-btn-group">
                    <button id="cut-open-folder-btn" class="secondary-btn" disabled>📂 開啟資料夾</button>
                    <button id="cut-play-result-btn" class="secondary-btn" disabled>▶ 播放結果</button>
                </div>
            </div>

            <!-- 分頁 3：語音辨識 -->
            <div id="transcribe-tab" class="tab-content">
                <div class="file-select-section">
                    <button id="transcribe-file-btn" class="file-btn">📂 選擇音檔/影片...</button>
                    <span id="transcribe-filename" class="filename-display">尚未選擇檔案</span>
                </div>

                <div class="transcribe-settings">
                    <div class="setting-row">
                        <label for="model-select" class="field-label">模型大小：</label>
                        <select id="model-select" class="theme-select">
                            <option value="tiny">tiny (速度最快，精準度低)</option>
                            <option value="base">base</option>
                            <option value="small">small</option>
                            <option value="medium">medium</option>
                            <option value="large-v3" selected>large-v3 (精準度高，速度較慢)</option>
                        </select>
                    </div>

                    <div class="setting-row checkbox-row">
                        <label class="theme-checkbox-container">
                            <input type="checkbox" id="show-timestamps" checked>
                            <span class="checkmark"></span>
                            在輸出中顯示時間戳記
                        </label>
                    </div>
                </div>

                <button id="transcribe-execute-btn" class="action-btn" disabled>🎤 開始文字辨識</button>
                <button id="transcribe-open-result-btn" class="secondary-btn" style="width: 100%; margin-top: 10px;" disabled>📂 打開辨識結果 (.txt)</button>
            </div>

            <!-- 統一底部的進度與狀態顯示區 (預設隱藏) -->
            <div id="global-progress" class="progress-box hidden">
                <div class="progress-info">
                    <span id="progress-status" class="status-text">任務處理中...</span>
                    <span id="progress-percent" class="percent-text">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"></div>
                </div>
                <div id="progress-meta" class="progress-meta">
                    <span id="progress-speed">狀態: 進行中</span>
                    <span id="progress-eta">請稍候...</span>
                </div>
            </div>

        </main>

        <footer class="app-footer">
            <p>前端渲染狀態: <span class="status-ready">獨立秒開</span></p>
        </footer>
    </div>

    <!-- 新增：啟動下載與初始化遮罩 (預設隱藏) -->
    <div id="startup-overlay" class="startup-overlay hidden">
        <div class="overlay-card">
            <div class="overlay-logo">🌻</div>
            <h2 class="overlay-title">正在準備核心組件...</h2>
            <p id="overlay-status" class="overlay-status">檢查本地工具中，請稍候...</p>
            <div class="overlay-progress-bg">
                <div id="overlay-progress-bar" class="overlay-progress-bar" style="width: 0%;"></div>
            </div>
            <span id="overlay-percent" class="overlay-percent">0%</span>
            <p class="overlay-note">此為首次執行程式，正在自動為您下載並安裝 FFmpeg 與 yt-dlp 等底層組件。下載過程大約需要一分鐘，完成後會自動為您開啟主介面。第二次啟動時將可以直接秒開！</p>
        </div>
    </div>

    <!-- 引入前端邏輯 -->
    <script src="js/app.js"></script>
</body>
</html>
